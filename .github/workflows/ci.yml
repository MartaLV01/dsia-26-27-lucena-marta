# Mi plantilla para DSIA
# .github/workflows/ci.yml
name: dsia-ci

on:
  push:
    branches: [main, proyecto1, proyecto2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests + coverage gate (>= 60%)
        working-directory: proyecto_i
        run: |
          python -m pytest -q \
            --cov=ventas_app \
            --cov=books_app \
            --cov-report=term-missing \
            --cov-fail-under=60
      
      - name: Tests Proyecto II + cobertura (>= 60%)
        working-directory: proyecto_ii
        run: |
          python -m pytest -q \
            --cov=book_recommender \
            --cov-report=term-missing \
            --cov-fail-under=60